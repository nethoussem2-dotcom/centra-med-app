name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Prepare build template with Android SDK 34
        run: |
          git clone --branch 0.24.1 --depth 1 https://github.com/flet-dev/flet-build-template.git /tmp/flet_template
          find /tmp/flet_template -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find /tmp/flet_template -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1
          pip install -r requirements.txt
      - name: Build Flet APK
        run: flet build apk --verbose --template-dir /tmp/flet_template
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentraMed_App
          path: build/apk/**/*.apk
